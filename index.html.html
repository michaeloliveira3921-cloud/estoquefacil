.y{background:#e6b800;color:#2b2200}.o{background:#ee7d1a}.r1 td{background:rgba(230,184,0,.16)}.r2 td{background:rgba(238,125,26,.18)}.r3 td{background:rgba(208,58,58,.18)}

<script>

const EMAILJS={service:"service_dd354uf",template:"template_6uxfgad",key:"ohJuDIJ76GpVz9A95"};
const $=s=>document.querySelector(s);

const LV={admin:3,gerente:2,operador:1},LN={admin:"Administrador",gerente:"Gerente",operador:"Operador"};
const dt=new Date();const iso=d=>d.toISOString().slice(0,10);
const plus=n=>iso(new Date(Date.now()+n*864e5));
function seed(){return{stores:["Loja Principal"],users:[],items:[],led:[],nid:1}}

try{DB=JSON.parse(localStorage.getItem("estoque_prod"))}catch(e){}
if(!DB)DB=seed();DB.sectors=DB.sectors||["Supermercado","Bomboniere","Festa","Embalagens"];DB.items.forEach(i=>{if(!i.sec)i.sec="Supermercado"});DB.users.forEach(u=>{if(!u.sec)u.sec="all"});

const MENU=[["dash","Painel",2],["estoque","Estoque",1],["validade","Validade",1],["scan","Leitor",1],["transf","Transferir",1],["venda","Vender",2],["prod","Cadastro",1],["fin","Financeiro",2],["comp","Comparar",2],["usr","Usuários",3],["lojas","Lojas e setores",2],["lixo","Lixeira",2],["entrada","Entrada",1],["contagem","Contagem",1],["log","Histórico",2],["notif","Notificações",1,1],["cfg","Configurações",1]];
async function setup(){const cl=x=>x.replace(/[<>"]/g,"").trim(),n=cl($("#sn").value),u=cl($("#su").value),p=$("#sp").value;if(!n||!u||p.length<6)return toast("Preencha nome, usuário e senha com 6 ou mais caracteres");const c=genRC();DB.users.push({n,u,ph:await H(p,u),l:"admin",s:"all",sec:"all",em:cl($("#se").value),rc:await H(c.replace(/-/g,""),u+"#rc")});save();render();showRC(c,u)}
function genRC(n=8){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=(window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(new Uint8Array(n)):Array.from({length:n},()=>Math.random()*256|0);return[...r].map(x=>a[x%a.length]).join("")}
function showRC(c,u,t){const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px";d.innerHTML=`<div class="card" style="max-width:360px;margin:0;display:grid;gap:10px"><b>${t||"Código de recuperação de "+u}</b><div style="font:700 22px monospace;letter-spacing:2px;text-align:center;padding:10px;background:var(--bg);border-radius:8px">${c}</div><small style="color:var(--mu)">Anote e guarde em lugar seguro. Ele aparece só desta vez e serve para redefinir a senha.</small><button class="b">Já anotei</button></div>`;document.body.appendChild(d);d.querySelector("button").onclick=()=>d.remove()}
async function forgot(){const cl=x=>x.replace(/[<>"]/g,"").trim(),u=fu(),c=$("#fc").value.replace(/[-\s]/g,"").toUpperCase(),p=$("#fp").value;
if(!DB.users.length)return toast("Nenhuma conta criada ainda. Use Criar Conta.");if(Date.now()<lock)return toast("Aguarde alguns segundos");if(p.length<6)return toast("A nova senha precisa ter 6 ou mais caracteres");
if(!(u&&((u.rc&&u.rc===await H(c,u.u+"#rc"))||(PEND[u.u]&&PEND[u.u].c===c&&PEND[u.u].t>Date.now())))){if(++fails>=5){lock=Date.now()+3e4;fails=0}return toast("Usuário ou código de recuperação incorretos")}
u.ph=await H(p,u.u);delete PEND[u.u];const fg=$("#fg");if(fg)fg.remove();save();render();toast("Senha redefinida. Faça o login com a nova senha.")}
async function newRC(){const c=genRC();me.rc=await H(c.replace(/-/g,""),me.u+"#rc");save();showRC(c,me.u)}
function openForgot(){const d=document.createElement("div");d.id="fg";d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px";d.innerHTML=`<div class="card" style="max-width:380px;width:100%;margin:0;display:grid;gap:10px;max-height:90vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Esqueceu a senha?</h2><button class="b" style="background:var(--bg);color:var(--tx)" id="fx">✕</button></div><small style="color:var(--mu)">Informe o e-mail cadastrado para receber um código de recuperação.</small><input id="fu" type="email" placeholder="E-mail cadastrado" autocapitalize="off"><button class="b" onclick="sendCode()">Enviar código por e-mail</button><input id="fc" placeholder="Código recebido" autocomplete="off"><input id="fp" type="password" placeholder="Nova senha (mínimo 6 caracteres)"><button class="b" onclick="forgot()">Redefinir senha</button></div>`;document.body.appendChild(d);d.querySelector("#fx").onclick=()=>d.remove();d.onclick=e=>{if(e.target===d)d.remove()}}
const PEND={};
function fu(){const v=($("#fu").value||"").replace(/[<>"]/g,"").trim().toLowerCase();return DB.users.find(x=>x.u.toLowerCase()===v||(x.em&&x.em.toLowerCase()===v))}
async function sendCode(){const u=fu(),M={sid:EMAILJS.service,tid:EMAILJS.template,key:EMAILJS.key};if(!DB.users.length)return toast("Nenhuma conta criada ainda.");

try{const r=await fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({service_id:M.sid,template_id:M.tid,user_id:M.key,template_params:{to_email:u.em,to_name:u.n,code:c,subject:"Código de confirmação – EstoqueFácil",message:`Olá, senhor(a) ${u.n}. Este é o seu código de confirmação para alteração de senha. Por favor, insira o código ${c} no local destinado pelo site.`}})});toast(r.ok?"Código enviado para o e-mail (vale 10 minutos).":"Falha ao enviar o e-mail. Confira a configuração.")}catch(e){toast("Sem conexão para enviar o e-mail.")}}
let fails=0,lock=0;
async function login(){if(Date.now()<lock)return toast("Aguarde alguns segundos");const u=DB.users.find(x=>x.u===$("#lu").value.trim());if(!u||u.ph!==await H($("#lp").value,u.u)){if(++fails>=5){lock=Date.now()+3e4;fails=0}return toast("Usuário ou senha incorretos")}me=u;flt="all";view=lvl()>=2?"dash":"estoque";render();notify()}
function logout(){stopScan();me=null;render()}
function render(){
if(!me){$("#root").innerHTML=`<div class="lg"><div class="art"><svg viewBox="0 0 400 250" fill="none"><rect x="30" y="40" width="190" height="170" rx="8" fill="rgba(255,255,255,.08)" stroke="#fff" stroke-opacity=".5" stroke-width="3"/><path d="M30 97h190M30 154h190" stroke="#fff" stroke-opacity=".5" stroke-width="3"/><rect x="45" y="62" width="40" height="35" fill="#e6b800"/><rect x="90" y="72" width="30" height="25" fill="#5aa0ff"/><rect x="125" y="57" width="45" height="40" fill="#fff" fill-opacity=".85"/><rect x="175" y="67" width="35" height="30" fill="#ee7d1a"/><rect x="45" y="119" width="50" height="35" fill="#5aa0ff"/><rect x="100" y="109" width="40" height="45" fill="#e6b800"/><rect x="146" y="124" width="60" height="30" fill="#fff" fill-opacity=".85"/><rect x="45" y="176" width="35" height="34" fill="#fff" fill-opacity=".85"/><rect x="86" y="166" width="55" height="44" fill="#ee7d1a"/><rect x="147" y="181" width="45" height="29" fill="#5aa0ff"/><rect x="250" y="40" width="120" height="65" rx="8" fill="#fff"/><g fill="#0f2747"><rect x="262" y="52" width="4" height="30"/><rect x="270" y="52" width="2" height="30"/><rect x="276" y="52" width="6" height="30"/><rect x="286" y="52" width="3" height="30"/><rect x="293" y="52" width="5" height="30"/><rect x="302" y="52" width="2" height="30"/><rect x="308" y="52" width="6" height="30"/><rect x="318" y="52" width="3" height="30"/><rect x="325" y="52" width="4" height="30"/><rect x="333" y="52" width="6" height="30"/><rect x="343" y="52" width="2" height="30"/><rect x="349" y="52" width="8" height="30"/></g><path d="M262 94h96" stroke="#d03a3a" stroke-width="3"/><g fill="#fff" fill-opacity=".9"><rect x="255" y="190" width="22" height="20"/><rect x="285" y="170" width="22" height="40"/><rect x="315" y="150" width="22" height="60"/><rect x="345" y="130" width="22" height="80"/></g><path d="M20 212h360" stroke="#fff" stroke-opacity=".6" stroke-width="3"/></svg><h2>${CFG.emp}</h2><p>Estoque, validade e lucros em um só lugar</p></div><div id="login">${DB.users.length?`<div class="card"><h2 style="margin:0">Acesso ao sistema</h2><input id="lu" placeholder="Usuário" autocapitalize="off"><input id="lp" type="password" placeholder="Senha"><button class="b" onclick="login()">Entrar</button><button class="lk" onclick="openForgot()">Esqueceu a senha?</button></div>`:`<div class="card"><h2 style="margin:0">Primeiro acesso</h2><small style="color:var(--mu)">Crie a conta do administrador deste sistema.</small><input id="sn" placeholder="Seu nome"><input id="su" placeholder="Usuário" autocapitalize="off"><input id="se" type="email" placeholder="E-mail (para recuperar a senha)"><input id="sp" type="password" placeholder="Senha (mínimo 6 caracteres)"><button class="b" onclick="setup()">Criar administrador</button></div>`}</div></div>`;return}
const cur=MENU.find(m=>m[0]===view);if(!cur||lvl()<cur[2])view=lvl()>=2?"dash":"estoque";const nav=GR.filter(g=>lvl()>=g[1]).map(g=>`<button class="${g[2].includes(view)?"on":""}" onclick="go('${g[2].find(al)}')">${g[0]}</button>`).join("");const G=GR.find(g=>g[2].includes(view)),tv=G?G[2].filter(al):[],tabs=tv.length>1?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${tv.map(v=>`<button class="b" style="${v===view?"":"background:var(--sf);color:var(--tx)"}" onclick="go('${v}')">${MENU.find(m=>m[0]===v)[1]}</button>`).join("")}</div>`:"";const _u=[].map(m=>`<button class="${view===m[0]?"on":""}" onclick="go('${m[0]}')">${m[1]}</button>`).join("");
const sel=lvl()>=2?`<select onchange="flt=this.value;render()"><option value="all">Todas as lojas</option>${DB.stores.map(s=>`<option ${flt===s?"selected":""}>${s}</option>`).join("")}</select>`:`<span class="tg ok">${me.s}</span>`;
$("#root").innerHTML=`<div id="app"><div class="ov" onclick="menu(0)"></div><nav id="nv"><h1>📦 ${CFG.emp}</h1>${nav}</nav><main><div class="top"><div style="display:flex;gap:10px;align-items:center"><button class="b hb" onclick="menu(1)">☰</button><h2>${MENU.find(m=>m[0]===view)[1]}</h2></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="b" onclick="go('notif')">🔔 ${alerts().length}</button>${sel}<small>${me.n} · ${LN[me.l]}${me.sec==="all"?"":" · "+me.sec}</small><button class="b" onclick="logout()">Sair</button></div></div>${tabs}<div id="v"></div></main></div>`;
if(view!=="scan")stopScan();
$("#v").innerHTML=V[view]();if(view==="estoque")fillT()}
function go(v){view=v;render()}
function menu(o){$("#nv").classList.toggle("open",!!o);document.querySelector(".ov").classList.toggle("open",!!o)}
const opts=(arr,fn)=>arr.map(fn).join("");
const itOpt=i=>`<option value="${i.id}">${i.n} · ${i.s} · ${i.q} un</option>`;
const V={
dash(){const it=items();const un=it.reduce((a,i)=>a+i.q,0),val=it.reduce((a,i)=>a+i.q*i.cu,0);
const ven=it.filter(i=>i.v&&days(i.v)<=30).length,bx=it.filter(i=>i.q<=i.mn);

return`<div class="grid"><div class="kpi"><small>Unidades</small><b>${un}</b></div><div class="kpi"><small>Valor em estoque</small><b>${brl(val)}</b></div>${[[1,"Atenção · 40 a 21 dias","#e6b800"],[2,"Alerta · 20 a 10 dias","#ee7d1a"],[3,"Crítico · até 9 dias","#d03a3a"]].map(x=>`<div class="kpi" style="border-top-color:${x[2]}"><small>${x[1]}</small><b>${it.filter(i=>lv(i.v)===x[0]).length}</b></div>`).join("")}<div class="kpi"><small>Estoque baixo</small><b>${bx.length}</b></div>${lp}</div>
<div class="card"><b>Reposição necessária</b><div class="tw"><table><tr><th>Produto</th><th>Loja</th><th>Qtd</th><th>Mín.</th></tr>${opts(bx,i=>`<tr><td>${i.n}</td><td>${i.s}</td><td>${i.q}</td><td>${i.mn}</td></tr>`)||"<tr><td>Tudo em dia</td></tr>"}</table></div></div>`},

function fillT(){const k=q.toLowerCase();const it=items().filter(i=>i.n.toLowerCase().includes(k)||i.c.includes(k));

function sell(id,n){const i=DB.items.find(x=>x.id==id);if(!i||!(n>0))return toast("Dados inválidos");if(n>i.q)return toast("Estoque insuficiente");
i.q-=n;DB.led.push({d:iso(dt),t:"venda",x:`${n}× ${i.n}`,s:i.s,sc:i.sec,rev:n*i.pr,cost:n*i.cu});save();toast("Venda registrada: "+brl(n*i.pr));render()}
function transfer(){const i=DB.items.find(x=>x.id==$("#ti").value),d=$("#td").value,n=+$("#tq").value;
if(!i||!(n>0)||n>i.q)return toast("Quantidade inválida");if(d===i.s)return toast("Escolha outra loja de destino");
i.q-=n;let t=DB.items.find(x=>x.c===i.c&&x.s===d&&x.v===i.v);
if(t)t.q+=n;else DB.items.push({...i,id:DB.nid++,s:d,q:n});save();toast(`${n} un. transferidas para ${d}`);render()}
function addProd(){const n=$("#pn").value.trim(),c=$("#pc").value.trim();if(!n||!c)return toast("Informe nome e código");
const s=$("#ps").value,v=$("#pv").value,q2=+$("#pq").value||0;const ex=DB.items.find(x=>x.c===c&&x.s===s&&x.v===v);
if(ex)ex.q+=q2;else DB.items.push({id:DB.nid++,n,c,cu:+($("#pcu")||{}).value||0,pr:+($("#ppr")||{}).value||0,mn:+$("#pm").value||0,s,q:q2,v,f:$("#pf").value.replace(/[<>"]/g,"").trim(),sec:$("#psec").value});
save();toast("Produto salvo");render()}
function toTrash(t,d,l){(DB.trash=DB.trash||[]).push({t,d,l,by:me.n,at:new Date().toLocaleString("pt-BR")})}
function delItem(id){const i=DB.items.find(x=>x.id===id);if(i){toTrash("item",i,`${i.n} · ${i.s}`);DB.items=DB.items.filter(x=>x.id!==id);save();render()}}
function delLed(k){const e=DB.led[k];if(e){toTrash("lançamento",e,`${e.t}: ${e.x} (${brl(e.rev||e.cost)})`);DB.led.splice(k,1);save();render()}}
function addExp(){const v=+$("#ev").value,x=$("#ed").value.trim();if(!(v>0)||!x)return toast("Informe descrição e valor");
DB.led.push({d:iso(dt),t:"despesa",x,s:$("#es").value,sc:me.sec==="all"?"Geral":me.sec,rev:0,cost:v});save();toast("Despesa lançada");render()}
async function addUser(){const u=$("#uu").value.trim(),n=$("#un").value.trim(),p=$("#up").value;if(!u||!n||!p)return toast("Preencha todos os campos");if(p.length<6)return toast("Senha com no mínimo 6 caracteres");
if(DB.users.some(x=>x.u===u))return toast("Usuário já existe");let s=$("#us").value;const l=$("#ul").value;if(l==="operador"&&s==="all")s=DB.stores[0];
const sec=$("#usec").value,em=$("#ue").value.trim();const c=genRC();DB.users.push({n,u,ph:await H(p,u),l,s,sec,em,rc:await H(c.replace(/-/g,""),u+"#rc")});save();toast("Usuário registrado");render();showRC(c,u)}
function delUser(k){const u=DB.users[k];if(!u)return;if(u.l==="admin"&&DB.users.filter(x=>x.l==="admin").length<2)return toast("Mantenha pelo menos um administrador");toTrash("usuário",u,`${u.n} (${u.u})`);DB.users.splice(k,1);save();toast("Usuário movido para a lixeira");render()}
function found(code){code=(code||"").trim();if(!code)return;const r=items().filter(i=>i.c===code);
$("#res").innerHTML=r.length?`<div class="card tw"><table><tr><th>Produto</th><th>Loja</th><th>Qtd</th><th>Preço</th><th>Validade</th><th></th></tr>${opts(r,i=>`<tr><td>${i.n}</td><td>${i.s}</td><td>${i.q}</td><td>${brl(i.pr)}</td><td>${vtag(i.v)}</td><td><button class="b" onclick="sell(${i.id},1)">Vender 1</button></td></tr>`)}</table></div>`:`<div class="card">Código ${code} não encontrado no escopo atual.</div>`;
$("#cod").value=code}
let det=null,loop=0;
async function startScan(){if(!("BarcodeDetector"in window)||!navigator.mediaDevices)return toast("Câmera não suportada aqui. Digite o código ou use leitor USB.");
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});const v=$("#vid");v.style.display="block";v.srcObject=stream;await v.play();
det=new BarcodeDetector({formats:["ean_13","ean_8","code_128","upc_a","upc_e","qr_code"]});loop=1;
const tick=async()=>{if(!loop)return;try{const b=await det.detect(v);if(b.length){found(b[0].rawValue);stopScan();return}}catch(e){}setTimeout(tick,300)};tick()}catch(e){toast("Não foi possível acessar a câmera")}}
function stopScan(){loop=0;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
V.scan=()=>`<div class="card"><video id="vid" playsinline muted style="display:none;margin-bottom:8px"></video><div class="f"><button class="b" onclick="startScan()">📷 Abrir câmera</button><button class="b" onclick="flip()">Trocar câmera</button><label class="b" style="text-align:center;cursor:pointer">📸 Tirar foto do código<input type="file" accept="image/*" capture="environment" hidden onchange="photo(this)"></label></div></div><div class="card"><b>Leitor externo ou digitação</b><div class="f" style="margin-top:8px"><input id="cod" inputmode="none" autocomplete="off" placeholder="Aponte o leitor ou toque para digitar" onfocus="this.inputMode='numeric'" onkeydown="if(event.key==='Enter')found(this.value)"><button class="b" onclick="found($('#cod').value)">Buscar</button></div><small style="color:var(--mu)">Coletores Zebra (DataWedge), leitores USB e Bluetooth funcionam como teclado: basta apontar e ler, sem tocar na tela.</small></div><div id="res"></div>`;
addEventListener("keydown",e=>{if(!me||view!=="scan"||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;const c=$("#cod");if(!c)return;if(e.key==="Enter"){found(c.value);e.preventDefault()}else if(e.key.length===1)c.value+=e.key});
let fm="environment",zr=null;
function flip(){fm=fm==="environment"?"user":"environment";if(stream||zr){stopScan();startScan()}}
function lib(){return window.ZXing?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function startScan(){if(!navigator.mediaDevices)return toast("Câmera indisponível. Use leitor externo ou digite.");const v=$("#vid");stopScan();v.style.display="block";
try{if("BarcodeDetector"in window){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:fm,width:{ideal:1280}}});v.srcObject=stream;await v.play();det=new BarcodeDetector();loop=1;const tick=async()=>{if(!loop)return;try{const b=await det.detect(v);if(b.length){hit(b[0].rawValue);return}}catch(e){}setTimeout(tick,250)};tick()}
else{await lib();zr=new ZXing.BrowserMultiFormatReader();await zr.decodeFromConstraints({video:{facingMode:fm}},v,r=>{if(r)hit(r.getText())})}}
catch(e){v.style.display="none";toast("Câmera bloqueada ou indisponível. Verifique a permissão ou use leitor externo.")}}
function hit(c){navigator.vibrate&&navigator.vibrate(60);stopScan();found(c)}
function stopScan(){loop=0;if(zr){try{zr.reset()}catch(e){}zr=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}const v=$("#vid");if(v)v.style.display="none"}
function found(code){code=(code||"").trim();if(!code)return;const r=items().filter(i=>i.c===code);const c=$("#cod");if(c)c.value="";
try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),90)}catch(e){}
$("#res").innerHTML=r.length?`<div class="card"><b style="color:var(--ok)">✔ Código ${code}</b><div class="tw"><table><tr><th>Produto</th><th>Loja</th><th>Qtd</th>${lvl()>=2?"<th>Preço</th>":""}<th>Validade</th>${lvl()>=2?"<th></th>":""}</tr>${opts(r,i=>`<tr><td>${i.n}</td><td>${i.s}</td><td>${i.q}</td>${lvl()>=2?`<td>${brl(i.pr)}</td>`:""}<td>${vtag(i.v)}</td>${lvl()>=2?`<td><button class="b" onclick="sell(${i.id},1)">Vender 1</button></td>`:""}</tr>`)}</table></div></div>`:`<div class="card"><b style="color:var(--er)">Código ${code} não encontrado</b></div>`}
function errMsg(e){return e&&e.name==="NotAllowedError"?"Permissão da câmera negada ou bloqueada neste quadro. Abra o link em uma nova aba do navegador e libere a câmera, ou use “Tirar foto do código”.":e&&e.name==="NotFoundError"?"Nenhuma câmera encontrada neste aparelho.":"Falha ao abrir a câmera ("+(e&&e.name||"erro")+"). Use “Tirar foto do código” ou o leitor externo."}
async function startScan(){stopScan();const v=$("#vid");
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$("#res").innerHTML=`<div class="card">A câmera ao vivo exige conexão segura e permissão do navegador. Use “Tirar foto do código”.</div>`;return}
try{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:fm}}})}catch(e){if(e.name==="NotAllowedError")throw e;stream=await navigator.mediaDevices.getUserMedia({video:true})}
v.style.display="block";v.srcObject=stream;await v.play();
if("BarcodeDetector"in window){det=new BarcodeDetector();loop=1;const tick=async()=>{if(!loop)return;try{const b=await det.detect(v);if(b.length){hit(b[0].rawValue);return}}catch(e){}setTimeout(tick,250)};tick()}
else{await lib();zr=new ZXing.BrowserMultiFormatReader();zr.decodeFromVideoElement(v,r=>{if(r)hit(r.getText())})}}
catch(e){stopScan();$("#res").innerHTML=`<div class="card" style="border-left:4px solid var(--er)">${errMsg(e)}</div>`}}
async function photo(inp){const f=inp.files[0];inp.value="";if(!f)return;toast("Lendo imagem...");let code=null;
try{if("BarcodeDetector"in window){const b=await new BarcodeDetector().detect(await createImageBitmap(f));if(b.length)code=b[0].rawValue}}catch(e){}
if(!code){try{await lib();const u=URL.createObjectURL(f);const r=await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(u);code=r.getText();URL.revokeObjectURL(u)}catch(e){}}
code?found(code):$("#res").innerHTML=`<div class="card" style="border-left:4px solid var(--er)">Não foi possível ler o código na foto. Aproxime, mantenha o foco com boa luz, ou digite o código.</div>`}
V.lixo=()=>{const t=DB.trash||[];return`<div class="card tw"><table><tr><th>Tipo</th><th>Item</th><th>Excluído por</th><th>Data</th><th></th></tr>${opts(t,(x,k)=>`<tr><td>${x.t}</td><td>${x.l}</td><td>${x.by}</td><td>${x.at}</td><td><button class="b" onclick="restore(${k})">Restaurar</button> ${lvl()>=3?`<button class="b r" onclick="purge(${k})">Apagar</button>`:""}</td></tr>`)||"<tr><td>Lixeira vazia</td></tr>"}</table></div>`};
function restore(k){const x=DB.trash[k];if(x.t==="item")DB.items.push(x.d);else if(x.t==="usuário"){if(DB.users.some(u=>u.u===x.d.u))return toast("Já existe usuário com este login");DB.users.push(x.d)}else DB.led.push(x.d);DB.trash.splice(k,1);save();toast("Restaurado");render()}
let arm=-1;function purge(k){if(arm!==k){arm=k;return toast("Toque de novo para apagar definitivamente")}arm=-1;DB.trash.splice(k,1);save();render()}

V.lojas=()=>`<div class="card f"><label>Nova loja<input id="nl" placeholder="Nome da loja"></label><button class="b" onclick="addStore()">Adicionar loja</button></div><div class="card tw"><table><tr><th>Loja</th><th>Itens</th><th></th></tr>${opts(DB.stores,(s,k)=>`<tr><td><input id="sn${k}" value="${s}"></td><td>${DB.items.filter(i=>i.s===s).length}</td><td><button class="b" onclick="renStore(${k})">Salvar nome</button></td></tr>`)}</table></div>`;
function addStore(){const n=$("#nl").value.replace(/[<>"]/g,"").trim();if(!n)return toast("Informe o nome da loja");if(DB.stores.includes(n))return toast("Loja já existe");DB.stores.push(n);save();toast("Loja adicionada");render()}
function renStore(k){const o=DB.stores[k],n=$("#sn"+k).value.replace(/[<>"]/g,"").trim();if(!n||n===o)return;if(DB.stores.includes(n))return toast("Nome já usado");DB.stores[k]=n;DB.items.forEach(i=>{if(i.s===o)i.s=n});DB.users.forEach(u=>{if(u.s===o)u.s=n});DB.led.forEach(e=>{if(e.s===o)e.s=n});(DB.trash||[]).forEach(t=>{if(t.d&&t.d.s===o)t.d.s=n});if(flt===o)flt=n;save();toast("Loja renomeada");render()}
const sx=i=>!me||me.sec==="all"||i.sec===me.sec;
const STG=["","Atenção","Alerta","Crítico"],SC=["","#e6b800","#ee7d1a","#d03a3a"];
function alerts(){return items().filter(i=>lv(i.v)>0&&i.q>0).sort((a,b)=>a.v>b.v?1:-1)}
function msg(i){const d=days(i.v);return `${i.n} (${i.s}): ${d<0?"vencido há "+(-d)+" dia(s)":d===0?"vence hoje":"vence em "+d+" dia(s)"}`}
function summary(){const a=alerts();return "Validade: "+[3,2,1].map(n=>[n,a.filter(i=>lv(i.v)===n).length]).filter(x=>x[1]).map(x=>`${x[1]} ${STG[x[0]].toLowerCase()}`).join(", ")}
function notify(force){if(!me||!alerts().length)return;const k="ntf_"+me.u,t=iso(new Date());let last;try{last=localStorage.getItem(k)}catch(e){}
if(!force&&last===t)return;if(!("Notification"in window)||Notification.permission!=="granted")return;
try{new Notification("EstoqueFácil · alertas de validade",{body:summary(),tag:"val"});try{localStorage.setItem(k,t)}catch(e){}}catch(e){}}
async function askNotif(){if(!("Notification"in window))return toast("Este navegador não oferece avisos no aparelho. Use o e-mail ou esta aba.");const p=await Notification.requestPermission();toast(p==="granted"?"Avisos ativados neste aparelho":"Permissão não concedida");if(p==="granted")notify(true)}
function mail(){if(!me.em)return toast("Cadastre seu e-mail em Configurações");const b=alerts().map(i=>`[${STG[lv(i.v)]}] ${msg(i)}`).join("\n");location.href="mailto:"+me.em+"?subject="+encodeURIComponent("Alertas de validade - "+new Date().toLocaleDateString("pt-BR"))+"&body="+encodeURIComponent(b||"Nenhum alerta.")}
V.notif=()=>{const a=alerts();return`<div class="card f"><button class="b" onclick="askNotif()">🔔 Ativar avisos no aparelho</button><button class="b" onclick="mail()">✉ Enviar resumo por e-mail</button></div><div class="card"><b>${a.length?summary():"Nenhum produto em alerta"}</b><small style="display:block;color:var(--mu);margin-top:4px">Os avisos no aparelho aparecem quando o site está aberto no navegador. O e-mail abre o seu aplicativo de e-mail já preenchido.</small></div>${opts(a,i=>`<div class="card" style="border-left:5px solid ${SC[lv(i.v)]}"><b>${STG[lv(i.v)]}</b> · ${msg(i)}<br><small style="color:var(--mu)">Fornecedor: ${i.f||"—"} · Qtd: ${i.q}</small></div>`)}`};
function setEm(v){me.em=v.replace(/[<>"]/g,"").trim();save();toast("E-mail salvo")}
function addSec(){const n=$("#nsec").value.replace(/[<>"]/g,"").trim();if(!n)return toast("Informe o setor");if(DB.sectors.includes(n))return toast("Setor já existe");DB.sectors.push(n);save();toast("Setor adicionado");render()}
const _l=V.lojas;V.lojas=()=>_l()+`<div class="card"><b>Setores</b><div class="f" style="margin-top:8px"><label>Novo setor<input id="nsec" placeholder="Ex.: Papelaria"></label><button class="b" onclick="addSec()">Adicionar setor</button></div><p style="color:var(--mu);margin:8px 0 0">${DB.sectors.join(" · ")}</p></div>`;
const secCard=()=>`<div class="card"><b>Setores</b><div class="f" style="margin:8px 0"><label>Novo setor<input id="nsec" placeholder="Ex.: Papelaria"></label><button class="b" onclick="addSec()">Adicionar setor</button></div><div class="tw"><table><tr><th>Setor (toque para renomear)</th><th>Itens</th><th></th></tr>${opts(DB.sectors,(s,k)=>`<tr><td><input id="sc${k}" value="${s}"></td><td>${DB.items.filter(i=>i.sec===s).length}</td><td><button class="b" onclick="renSec(${k})">Salvar nome</button></td></tr>`)}</table></div></div>`;
V.lojas=()=>_l()+secCard();
function renSec(k){const o=DB.sectors[k],n=$("#sc"+k).value.replace(/[<>"]/g,"").trim();if(!n||n===o)return;if(DB.sectors.includes(n))return toast("Nome já usado");DB.sectors[k]=n;DB.items.forEach(i=>{if(i.sec===o)i.sec=n});DB.users.forEach(u=>{if(u.sec===o)u.sec=n});DB.led.forEach(e=>{if(e.sc===o)e.sc=n});(DB.trash||[]).forEach(t=>{if(t.d&&t.d.sec===o)t.d.sec=n;if(t.d&&t.d.sc===o)t.d.sc=n});save();toast("Setor renomeado");render()}
async function H(p,u){const s="estq|"+u+"|"+p;if(!(window.crypto&&crypto.subtle))return"p:"+s;const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
(async()=>{for(const u of DB.users)if(u.p){u.ph=await H(u.p,u.u);delete u.p}save()})();
async function setPw(){const a=$("#pw1").value;if(a.length<6)return toast("Mínimo de 6 caracteres");me.ph=await H(a,me.u);save();$("#pw1").value="";toast("Senha alterada")}
let idle=Date.now();["click","keydown","touchstart"].forEach(e=>addEventListener(e,()=>idle=Date.now()));setInterval(()=>{if(me&&Date.now()-idle>9e5){logout();toast("Sessão encerrada por inatividade")}},3e4);
V.entrada=()=>{const e=(DB.ent||[]).filter(x=>(scope()==="all"||x.s===scope())&&(me.sec==="all"||x.sec===me.sec)).slice(-20).reverse();return`<div class="card f"><label>Produto<select id="en">${opts(items(),i=>`<option value="${i.id}">${i.n} · ${i.s}</option>`)}</select></label><label>Quantidade<input id="eq" type="number" min="1" value="1"></label><label>Validade do lote<input id="ev2" type="date"></label><label>Fornecedor<input id="ef"></label><label>Nota fiscal<input id="enf"></label><button class="b" onclick="entrada()">Registrar entrada</button></div><div class="card tw"><table><tr><th>Data</th><th>Produto</th><th>Qtd</th><th>Fornecedor</th><th>NF</th><th>Por</th></tr>${opts(e,x=>`<tr><td>${x.at}</td><td>${x.n}</td><td>${x.q}</td><td>${x.f}</td><td>${x.nf}</td><td>${x.by}</td></tr>`)}</table></div>`};
function entrada(){const i=DB.items.find(x=>x.id==$("#en").value),n=+$("#eq").value,v=$("#ev2").value,cl=s=>s.replace(/[<>"]/g,"").trim(),f=cl($("#ef").value),nf=cl($("#enf").value);if(!i||!(n>0))return toast("Informe produto e quantidade");
let t=i;if(v&&v!==i.v){t=DB.items.find(x=>x.c===i.c&&x.s===i.s&&x.v===v);if(!t){t={...i,id:DB.nid++,q:0,v};DB.items.push(t)}}
t.q+=n;if(f)t.f=f;(DB.ent=DB.ent||[]).push({at:new Date().toLocaleDateString("pt-BR"),by:me.n,n:i.n,q:n,f:f||i.f||"—",nf:nf||"—",s:i.s,sec:i.sec});save();toast("Entrada registrada");render()}
V.contagem=()=>{const p=(DB.cnt||[]).filter(c=>lvl()>=2?c.st==="pendente":c.by===me.n).slice(-10).reverse();
return`<div class="card"><b>Nova contagem</b><small style="display:block;color:var(--mu)">Digite a quantidade contada. Deixe em branco o que não contou.</small><div class="tw"><table><tr><th>Produto</th><th>Loja</th><th>Contado</th></tr>${opts(items(),i=>`<tr><td>${i.n}${i.v?` <small>(${i.v.split("-").reverse().join("/")})</small>`:""}</td><td>${i.s}</td><td><input class="ci" data-id="${i.id}" type="number" min="0" style="width:90px"></td></tr>`)}</table></div><button class="b" style="margin-top:8px" onclick="sendCnt()">Enviar contagem</button></div>
<div class="card"><b>${lvl()>=2?"Contagens pendentes":"Minhas contagens"}</b>${opts(p,c=>`<div style="margin-top:10px"><small>${c.at} · ${c.by} · <b>${c.st}</b></small><div class="tw"><table><tr><th>Produto</th><th>Sistema</th><th>Contado</th><th>Diferença</th></tr>${opts(c.l,x=>{const d=x.f-x.s2;return`<tr><td>${x.n}</td><td>${x.s2}</td><td>${x.f}</td><td><b style="color:${d?"var(--er)":"var(--ok)"}">${d>0?"+":""}${d}</b></td></tr>`})}</table></div>${lvl()>=2&&c.st==="pendente"?`<button class="b" onclick="decCnt(${c.id},1)">Aprovar ajuste</button> <button class="b r" onclick="decCnt(${c.id},0)">Recusar</button>`:""}</div>`)||"<small>Nenhuma contagem</small>"}</div>`};
function sendCnt(){const l=[...document.querySelectorAll(".ci")].filter(e=>e.value!=="").map(e=>{const i=DB.items.find(x=>x.id==e.dataset.id);return{id:i.id,n:i.n,s2:i.q,f:+e.value}});if(!l.length)return toast("Informe ao menos uma quantidade");(DB.cnt=DB.cnt||[]).push({id:Date.now(),at:new Date().toLocaleString("pt-BR"),by:me.n,l,st:"pendente"});save();toast("Contagem enviada ao gerente");render()}
function decCnt(id,ok){const c=(DB.cnt||[]).find(x=>x.id===id);if(!c)return;if(ok)c.l.forEach(x=>{const i=DB.items.find(y=>y.id===x.id);if(i)i.q=Math.max(0,i.q+x.f-x.s2)});c.st=ok?"aprovada":"recusada";save();toast(ok?"Ajuste aplicado":"Contagem recusada");render()}
V.log=()=>`<div class="card tw"><table><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Detalhe</th></tr>${opts((DB.log||[]).slice(-100).reverse(),x=>`<tr><td>${x.at}</td><td>${x.by}</td><td>${x.a}</td><td>${x.d||""}</td></tr>`)||"<tr><td>Sem registros</td></tr>"}</table></div>`;
const LOGN={sell:"Venda",transfer:"Transferência",addProd:"Produto cadastrado",delItem:"Item para a lixeira",delUser:"Usuário para a lixeira",delLed:"Lançamento para a lixeira",restore:"Restaurado da lixeira",addUser:"Usuário registrado",addExp:"Despesa lançada",addStore:"Loja adicionada",renStore:"Loja renomeada",addSec:"Setor adicionado",renSec:"Setor renomeado",entrada:"Entrada de mercadoria",sendCnt:"Contagem enviada",decCnt:"Contagem decidida",setPw:"Senha alterada"};
const LD={sell:a=>{const i=DB.items.find(x=>x.id==a[0]);return i?`${a[1]}× ${i.n} (${i.s})`:""},transfer:()=>`${$("#ti").selectedOptions[0].text} → ${$("#td").value} (${$("#tq").value} un)`,addProd:()=>$("#pn").value,addUser:()=>$("#uu").value,addExp:()=>$("#ed").value+" "+$("#ev").value,entrada:()=>`${$("#en").selectedOptions[0].text} +${$("#eq").value}`,delItem:a=>{const i=DB.items.find(x=>x.id===a[0]);return i?i.n:""}};
const snap=()=>JSON.stringify([DB.items,DB.users,DB.led,DB.trash,DB.stores,DB.sectors,DB.cnt,DB.ent]);
Object.keys(LOGN).forEach(n=>{const f=window[n];window[n]=function(...a){let d="";try{d=LD[n]?LD[n](a):""}catch(e){}const b=snap();return Promise.resolve(f.apply(this,a)).then(()=>{if(snap()!==b){(DB.log=DB.log||[]).push({at:new Date().toLocaleString("pt-BR"),by:me?me.n:"-",a:LOGN[n],d:String(d).replace(/[<>]/g,"")});if(DB.log.length>500)DB.log.shift();save()}})}});
const GR=[["Painel",2,["dash"]],["Estoque",1,["estoque","validade","notif"]],["Produtos",1,["prod","scan"]],["Movimentação",1,["entrada","transf","contagem","venda"]],["Financeiro",2,["fin","comp"]],["Gestão",2,["lojas","usr","log","lixo"]],["Configurações",1,["cfg"]]];
function al(v){return lvl()>=MENU.find(m=>m[0]===v)[2]}
function lgx(a,d){(DB.log=DB.log||[]).push({at:new Date().toLocaleString("pt-BR"),by:me.n,a,d});save()}
function dlg(t,v,cb){const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:rgba(5,15,30,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px";d.innerHTML=`<div class="card" style="width:100%;max-width:360px;margin:0;display:grid;gap:10px"><b>${t}</b><input id="dlgi" value="${v}"><div style="display:flex;gap:8px;justify-content:flex-end"><button class="b r" id="dn">Cancelar</button><button class="b" id="dy">Salvar</button></div></div>`;document.body.appendChild(d);const i=d.querySelector("#dlgi");i.focus();d.querySelector("#dn").onclick=()=>{d.remove();render()};d.querySelector("#dy").onclick=()=>{const x=i.value.replace(/[<>"]/g,"").trim();if(!x)return;d.remove();cb(x)};i.onkeydown=e=>{if(e.key==="Enter")d.querySelector("#dy").click()}}
function newSec(){dlg("Novo setor","",n=>{if(DB.sectors.includes(n)){toast("Setor já existe");return render()}DB.sectors.push(n);lgx("Setor criado",n);toast("Setor criado");render()})}
function editSec(k){const o=DB.sectors[k];dlg("Renomear setor",o,n=>{if(n===o)return render();if(DB.sectors.includes(n)){toast("Nome já usado");return render()}DB.sectors[k]=n;DB.items.forEach(i=>{if(i.sec===o)i.sec=n});DB.users.forEach(u=>{if(u.sec===o)u.sec=n});DB.led.forEach(e=>{if(e.sc===o)e.sc=n});(DB.trash||[]).forEach(t=>{if(t.d&&t.d.sec===o)t.d.sec=n;if(t.d&&t.d.sc===o)t.d.sc=n});lgx("Setor renomeado",o+" → "+n);toast("Setor renomeado");render()})}
const secCard2=()=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>Setores</b><button class="b" onclick="newSec()">➕ Novo setor</button></div>${opts(DB.sectors,(s,k)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)"><span>${s} <small style="color:var(--mu)">· ${DB.items.filter(i=>i.sec===s).length} itens</small></span><button class="b" onclick="editSec(${k})">Renomear</button></div>`)}</div>`;
V.lojas=()=>_l()+secCard2();
theme();setInterval(theme,6e4);setInterval(notify,36e5);render();
</script></body></html>
